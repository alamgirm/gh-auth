server:
  port: 8080

spring:
  application:
    name: github-device-flow-backend
  
  # Database configuration (H2 for simplicity, can use PostgreSQL in production)
  datasource:
    url: jdbc:h2:mem:authdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  # H2 Console (for debugging)
  h2:
    console:
      enabled: true
      path: /h2-console

github:
  app:
    client-id: ${GITHUB_CLIENT_ID:Iv23liqRwUp1z3IgnKe3}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    authorize-url: https://github.com/login/oauth/authorize
    token-url: https://github.com/login/oauth/access_token
    user-api-url: https://api.github.com/user
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:3000/auth/callback}

# CORS configuration
cors:
  allowed-origins: http://localhost:3000
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

logging:
  level:
    root: INFO
    com.github.deviceflow: DEBUG

